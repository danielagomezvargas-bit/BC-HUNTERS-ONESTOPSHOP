<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gantt — Cronograma de despliegue</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  * { box-sizing: border-box; }
  #app {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.48) 0%, rgba(0,0,0,0.54) 100%),
      #1A1A1A;
  }
</style>
</head>
<body>
  <div id="app"></div>

  <!-- Inyectar datos del seller desde el simulador -->
  <script>
    try {
      var _raw = localStorage.getItem('simulator_summary');
      if (_raw) {
        var _s = JSON.parse(_raw);
        window.GANTT_INIT = {
          sellerName: (_s.negocio && _s.negocio.nombre) || '',
          sellerLogo: (_s.negocio && _s.negocio.logo)   || '',
          startDate:  new Date().toISOString().split('T')[0],
        };
      }
    } catch(e) {}
    if (!window.GANTT_INIT) window.GANTT_INIT = {
      sellerName: 'Hospital Auna',
      sellerLogo: '/logo-hospital-auna.svg',
      startDate:  new Date().toISOString().split('T')[0],
    };
  </script>

  <!-- PptxGenJS -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

  <!-- image-slot web component (logo drop-and-persist) -->
  <script src="image-slot.js"></script>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>

  <!-- Babel standalone (transpila gantt.jsx en el browser) -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>

  <!-- Export logic (.pptx con smart crop) -->
  <script src="gantt-export.js"></script>

  <!-- Gantt component -->
  <script type="text/babel" src="gantt.jsx"></script>
</body>
</html>
